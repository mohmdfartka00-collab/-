[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Route API endpoints to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Handle SPA routes for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
